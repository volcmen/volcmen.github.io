[install]
exact = true

[run]
bun = true
shell = "bun"

[lint]
maxWarnings = 0
ignorePatterns = [
  ".next/**",
  "out/**",
  "build/**",
  "next-env.d.ts",
  "public/doom/**",
  "components/ui/**",
]

# Preserve the previous core, TypeScript, import and Next.js rules natively.
# React checks use Bun's built-in react and react-hooks rules.
[lint.rules]
"constructor-super" = "off"
"for-direction" = "error"
"getter-return" = ["off", { "allowImplicit" = false }]
"no-async-promise-executor" = "error"
"no-case-declarations" = "error"
"no-class-assign" = "off"
"no-compare-neg-zero" = "error"
"no-cond-assign" = ["error", "except-parens"]
"no-const-assign" = "off"
"no-constant-binary-expression" = "error"
"no-constant-condition" = ["error", { "checkLoops" = "allExceptWhileTrue" }]
"no-control-regex" = "error"
"no-debugger" = "error"
"no-delete-var" = "error"
"no-dupe-args" = "off"
"no-dupe-class-members" = "off"
"no-dupe-else-if" = "error"
"no-dupe-keys" = "off"
"no-duplicate-case" = "error"
"no-empty" = ["error", { "allowEmptyCatch" = false }]
"no-empty-character-class" = "error"
"no-empty-pattern" = ["error", { "allowObjectPatternsAsParameters" = false }]
"no-empty-static-block" = "error"
"no-ex-assign" = "error"
"no-extra-boolean-cast" = ["error", {}]
"no-fallthrough" = ["error", { "allowEmptyCase" = false, "reportUnusedFallthroughComment" = false }]
"no-func-assign" = "off"
"no-global-assign" = ["error", { "exceptions" = [] }]
"no-import-assign" = "off"
"no-invalid-regexp" = ["error", {}]
"no-irregular-whitespace" = [
  "error",
  { "skipComments" = false, "skipJSXText" = false, "skipRegExps" = false, "skipStrings" = true, "skipTemplates" = false },
]
"no-loss-of-precision" = "error"
"no-misleading-character-class" = ["error", { "allowEscape" = false }]
"no-new-native-nonconstructor" = "off"
"no-nonoctal-decimal-escape" = "error"
"no-obj-calls" = "off"
"no-octal" = "error"
"no-prototype-builtins" = "error"
"no-redeclare" = ["off", { "builtinGlobals" = true }]
"no-regex-spaces" = "error"
"no-self-assign" = ["error", { "props" = true }]
"no-setter-return" = "off"
"no-shadow-restricted-names" = ["error", { "reportGlobalThis" = true }]
"no-sparse-arrays" = "error"
"no-this-before-super" = "off"
"no-unassigned-vars" = "error"
"no-undef" = ["off", { "typeof" = false }]
"no-unexpected-multiline" = "error"
"no-unreachable" = "off"
"no-unsafe-finally" = "error"
"no-unsafe-negation" = ["off", { "enforceForOrderingRelations" = false }]
"no-unsafe-optional-chaining" = ["error", { "disallowArithmeticOperators" = false }]
"no-unused-labels" = "error"
"no-unused-private-class-members" = "error"
"no-unused-vars" = "off"
"no-useless-assignment" = "error"
"no-useless-backreference" = "error"
"no-useless-catch" = "error"
"no-useless-escape" = ["error", { "allowRegexCharacters" = [] }]
"no-with" = "off"
"preserve-caught-error" = ["error", { "requireCatchParameter" = false }]
"require-yield" = "error"
"use-isnan" = ["error", { "enforceForIndexOf" = false, "enforceForSwitchCase" = true }]
"valid-typeof" = ["error", { "requireStringLiterals" = false }]
"no-new-symbol" = "off"
"no-var" = "error"
"prefer-const" = ["error", { "destructuring" = "any", "ignoreReadBeforeAssign" = false }]
"prefer-rest-params" = "error"
"prefer-spread" = "error"
"@typescript-eslint/ban-ts-comment" = ["error", { "minimumDescriptionLength" = 10 }]
"no-array-constructor" = "off"
"@typescript-eslint/no-array-constructor" = "error"
"@typescript-eslint/no-duplicate-enum-values" = "error"
"@typescript-eslint/no-dynamic-delete" = "error"
"@typescript-eslint/no-empty-object-type" = "error"
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-extra-non-null-assertion" = "error"
"@typescript-eslint/no-extraneous-class" = "error"
"@typescript-eslint/no-invalid-void-type" = "error"
"@typescript-eslint/no-misused-new" = "error"
"@typescript-eslint/no-namespace" = "error"
"@typescript-eslint/no-non-null-asserted-nullish-coalescing" = "error"
"@typescript-eslint/no-non-null-asserted-optional-chain" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/no-require-imports" = "error"
"@typescript-eslint/no-this-alias" = "error"
"@typescript-eslint/no-unnecessary-type-constraint" = "error"
"@typescript-eslint/no-unsafe-declaration-merging" = "error"
"@typescript-eslint/no-unsafe-function-type" = "error"
"no-unused-expressions" = [
  "off",
  { "allowShortCircuit" = false, "allowTernary" = false, "allowTaggedTemplates" = false, "enforceForJSX" = false, "ignoreDirectives" = false },
]
"@typescript-eslint/no-unused-expressions" = [
  "error",
  { "allowShortCircuit" = false, "allowTaggedTemplates" = false, "allowTernary" = false },
]
"@typescript-eslint/no-unused-vars" = "error"
"no-useless-constructor" = "off"
"@typescript-eslint/no-useless-constructor" = "error"
"@typescript-eslint/no-wrapper-object-types" = "error"
"@typescript-eslint/prefer-as-const" = "error"
"@typescript-eslint/prefer-literal-enum-member" = "error"
"@typescript-eslint/prefer-namespace-keyword" = "error"
"@typescript-eslint/triple-slash-reference" = "error"
"@typescript-eslint/unified-signatures" = "error"
"@typescript-eslint/adjacent-overload-signatures" = "error"
"@typescript-eslint/array-type" = "error"
"@typescript-eslint/ban-tslint-comment" = "error"
"@typescript-eslint/class-literal-property-style" = "error"
"@typescript-eslint/consistent-generic-constructors" = "error"
"@typescript-eslint/consistent-indexed-object-style" = "error"
"@typescript-eslint/consistent-type-assertions" = "error"
"@typescript-eslint/consistent-type-definitions" = "error"
"@typescript-eslint/no-confusing-non-null-assertion" = "error"
"no-empty-function" = ["off", { "allow" = [] }]
"@typescript-eslint/no-empty-function" = ["error", { "allow" = [] }]
"@typescript-eslint/no-inferrable-types" = "error"
"@typescript-eslint/prefer-for-of" = "error"
"@typescript-eslint/prefer-function-type" = "error"
"import/no-unresolved" = "error"
"import/named" = "off"
"import/namespace" = "error"
"import/default" = "error"
"import/export" = "error"
"import/no-named-as-default" = "warn"
"import/no-named-as-default-member" = "warn"
"import/no-duplicates" = "warn"
"react-hooks/rules-of-hooks" = "error"
"react-hooks/exhaustive-deps" = "warn"
"react-hooks/static-components" = "error"
"react-hooks/use-memo" = "error"
"react-hooks/component-hook-factories" = "error"
"react-hooks/preserve-manual-memoization" = "error"
"react-hooks/incompatible-library" = "warn"
"react-hooks/immutability" = "error"
"react-hooks/globals" = "error"
"react-hooks/refs" = "error"
"react-hooks/set-state-in-effect" = "error"
"react-hooks/error-boundaries" = "error"
"react-hooks/purity" = "error"
"react-hooks/set-state-in-render" = "error"
"react-hooks/unsupported-syntax" = "warn"
"react-hooks/config" = "error"
"react-hooks/gating" = "error"
"@next/next/google-font-display" = "warn"
"@next/next/google-font-preconnect" = "warn"
"@next/next/next-script-for-ga" = "warn"
"@next/next/no-async-client-component" = "warn"
"@next/next/no-before-interactive-script-outside-document" = "warn"
"@next/next/no-css-tags" = "warn"
"@next/next/no-head-element" = "warn"
"@next/next/no-html-link-for-pages" = "error"
"@next/next/no-img-element" = "warn"
"@next/next/no-page-custom-font" = "warn"
"@next/next/no-styled-jsx-in-document" = "warn"
"@next/next/no-sync-scripts" = "error"
"@next/next/no-title-in-document-head" = "warn"
"@next/next/no-typos" = "warn"
"@next/next/no-unwanted-polyfillio" = "warn"
"@next/next/inline-script-id" = "error"
"@next/next/no-assign-module-variable" = "error"
"@next/next/no-document-import-in-page" = "error"
"@next/next/no-duplicate-head" = "error"
"@next/next/no-head-import-in-document" = "error"
"@next/next/no-script-component-in-head" = "error"
"react/jsx-key" = ["error", { "checkKeyMustBeforeSpread" = true }]
"react/jsx-no-comment-textnodes" = "warn"
"react/no-array-index-key" = "warn"
"react/no-children-prop" = "error"
"react/no-clone-element" = "warn"
"react/no-danger" = "warn"
"react/no-danger-with-children" = "error"
"react/no-deprecated" = "error"
"react/no-direct-mutation-state" = "error"
"react/no-find-dom-node" = "error"
"react/no-namespace" = "error"
"react/no-render-return-value" = "error"
"react/no-unstable-nested-components" = "error"
"react/no-redundant-should-component-update" = "error"
"react/no-unused-state" = "warn"
"react/jsx-no-constructed-context-values" = "warn"
"react/jsx-no-script-url" = "warn"
"react/jsx-no-target-blank" = "warn"
"react/jsx-no-useless-fragment" = ["warn", { "allowExpressions" = true }]
"react/void-dom-elements-no-children" = "error"
"react/button-has-type" = "warn"
"react/iframe-missing-sandbox" = "warn"

[fmt]
printWidth = 100
tabWidth = 2
singleQuote = true
semi = true
trailingComma = "all"
arrowParens = "avoid"
sortImports = true
sortPackageJson = true
ignorePatterns = [
  ".next/**",
  "out/**",
  "build/**",
  "next-env.d.ts",
  "public/doom/**",
  "components/ui/**",
]

[fmt.sortTailwindcss]
stylesheet = "./app/globals.css"
functions = ["clsx", "cn", "cva", "twMerge"]
