version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - '*'
    # Update these four binaries together after checking native lint/format support.
    # Their stable dist-tag currently lacks the commands this project needs.
    ignore:
      - dependency-name: '@oven/bun-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
