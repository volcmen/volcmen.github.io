name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks, but let production deployments finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # next.config.ts already configures static export. Automatic configuration
        # only detects JavaScript configs and would create a competing next.config.js.
        uses: actions/configure-pages@v6.0.0

      - name: Restore Bun cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Restore Next cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('.bun-version', 'bun.lock') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'config/**', 'content/**', 'next.config.*', 'postcss.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('.bun-version', 'bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, format, typecheck and test with Bun
        run: bun run validate

      - name: Build Next.js app
        run: bun run build

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
